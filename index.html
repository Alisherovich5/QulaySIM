<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- `maximum-scale` and `user-scalable=no` stop iOS zooming the page when a
         field is focused: the keyboard opening would scale the layout up and
         leave a dark strip of unpainted canvas beside it. `viewport-fit=cover`
         lets the background reach under the home indicator so there is no bar
         there either.

         Disabling zoom is a real accessibility cost and worth naming: someone
         who relies on pinch-to-zoom loses it. Every font size here is already
         at least 11px and respects the system text-size setting, which is what
         most people actually use on a phone. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <!-- SEO tags are injected here by scripts/prerender.ts at build time, and
         by src/components/Seo.tsx at runtime. Declaring any of them statically
         breaks both — see the note in prerender.ts. -->
    <!--seo-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Sign in with Google loads its script from here and then opens a popup to
         the same origin. Warming the connection takes the DNS lookup and the TLS
         handshake off the critical path, which is the part of the sign-in delay
         that is actually ours to remove — the account chooser itself is Google's. -->
    <link rel="preconnect" href="https://accounts.google.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Blocking on purpose: it must run before paint. Kept in its own file
         because the site's CSP (script-src 'self') blocks inline scripts. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
