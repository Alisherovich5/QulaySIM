# Included by every location that can serve a response — see the note in
# nginx.conf about add_header not being inherited once a child declares one.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
# `same-origin` broke Sign in with Google. It puts any cross-origin popup we
# open into a separate browsing context group, which severs window.opener — so
# the Google popup signed the customer in and then had nothing to hand the
# credential back to. The symptom was a button that opened a normal-looking
# popup and then did nothing at all; the API never saw a single request.
#
# `same-origin-allow-popups` keeps the half that protects us — a cross-origin
# document that opens *this* page still gets no reference to it — and gives up
# only the half that OAuth needs.
add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;
# The storefront loads its own bundle, inline styles from Tailwind, flags from
# flagcdn and fonts from Google. Anything else is refused.
#
# checkout.atmos.uz is framed on the checkout page so the customer pays without
# leaving the site. Only frame-src is granted: the card fields live inside that
# frame, on ATMOS's origin, and no script or connection from it is allowed here —
# which is exactly why this stays a light-touch PCI arrangement rather than the
# heavy one that accepting card numbers ourselves would trigger. The dev host is
# listed too so the sandbox can be tested against production headers.
#
# The accounts.google.com entries are scoped to the /gsi/ paths the
# Sign-in-with-Google button needs — script, stylesheet, its XHRs and the
# iframe it renders into. Allowing the whole origin would not be necessary.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://flagcdn.com https://lh3.googleusercontent.com; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/ https://checkout.atmos.uz https://dev-checkout.atmos.uz; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
# Harmless over plain HTTP; the browser only honours it on HTTPS.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
