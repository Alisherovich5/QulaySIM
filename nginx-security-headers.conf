# Included by every location that can serve a response — see the note in
# nginx.conf about add_header not being inherited once a child declares one.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Cross-Origin-Opener-Policy same-origin always;
# The storefront loads its own bundle, inline styles from Tailwind, flags from
# flagcdn and fonts from Google. Anything else is refused.
#
# The accounts.google.com entries are scoped to the /gsi/ paths the
# Sign-in-with-Google button needs — script, stylesheet, its XHRs and the
# iframe it renders into. Allowing the whole origin would not be necessary.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://flagcdn.com https://lh3.googleusercontent.com; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
# Harmless over plain HTTP; the browser only honours it on HTTPS.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
