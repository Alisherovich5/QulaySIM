# Included by every location that can serve a response — see the note in
# nginx.conf about add_header not being inherited once a child declares one.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Cross-Origin-Opener-Policy same-origin always;
# The storefront loads its own bundle, inline styles from Tailwind, flags from
# flagcdn and fonts from Google. Anything else is refused.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://flagcdn.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
# Harmless over plain HTTP; the browser only honours it on HTTPS.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
