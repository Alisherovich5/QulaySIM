# The container speaks plain HTTP on 8080 and expects TLS to be terminated in
# front of it — a load balancer, ingress, or Cloudflare. What matters here is
# that the original scheme is forwarded, because the API and Django both
# decide cookie Secure flags and HSTS from it.
#
# To terminate TLS in this container instead, mount certificates and enable
# the commented server block at the bottom.

# Trust the forwarded scheme only when it is actually set, so a direct
# request cannot claim to be HTTPS.
map $http_x_forwarded_proto $forwarded_scheme {
    default $scheme;
    https   https;
    http    http;
}

# HTML is never cacheable; everything else keeps whatever its location says.
#
# Every prerendered page embeds the build's hashed asset filenames, so a cached
# copy pins that browser to the previous deploy's JavaScript. There used to be a
# `location = /index.html` block for this, but it stopped firing once try_files
# began reaching pages as `$uri/index.html`: that form serves the file inside
# the current location instead of re-running location matching, so no block
# specific to index.html can ever see it.
#
# Keying on the response content type catches them all — 87 prerendered pages,
# the fallback shell, and any page added later — without also making the
# favicon, the globe topology and the OG card uncacheable. nginx omits the
# header entirely when the value is empty.
map $sent_http_content_type $html_cache_control {
    default       "";
    ~*^text/html  "no-store";
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never advertise the version.
    server_tokens off;

    # nginx does not merge add_header across levels: a location that declares
    # even one header discards every header from its parent. These are
    # therefore included in each block that can serve a response rather than
    # declared once here.

    # Redirect to HTTPS when a proxy in front says the request arrived over
    # plain HTTP. Disabled locally, where there is no TLS to redirect to.
    set $should_redirect 0;
    if ($http_x_forwarded_proto = "http") { set $should_redirect 1; }
    if ($should_redirect = 1) { return 308 https://$host$request_uri; }

    # Hashed asset filenames are immutable; index.html must never be, or a
    # deploy leaves browsers pinned to the previous build.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Fonts, same reasoning as /assets/ but a different path: they are versioned
    # by the build that ships them and never change under a fixed name. With
    # only an ETag the browser still asked "has it changed?" on every page —
    # two extra round trips on a route where a round trip costs ~95 ms.
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # The API is reached through the same origin, so the refresh cookie is
    # first-party and no CORS preflight is involved.
    # Resolve the api service through Docker's DNS on every use, not once at
    # startup. nginx freezes a literal proxy_pass hostname at config load; a
    # deploy that recreates containers can hand the api's old address to the
    # admin, and this proxy then feeds requests to whichever container
    # inherited the IP — measured in production as Django answering
    # /sitemap.xml with a 400 while `getent hosts api` inside this very
    # container pointed at the right place. A variable target forces nginx
    # through the resolver each time, and valid=10s caps how long a stale
    # answer can outlive a re-deploy.
    resolver 127.0.0.11 valid=10s;
    set $api_upstream http://api:8000;

    location /api/ {
        # nginx's default body cap is 1 MB, which silently 413'd every avatar
        # between 1 MB and the front end's own limit — the picker said "up to
        # 15 MB" while the proxy refused a sixth of that. 20m leaves headroom
        # over the API's 15 MB cap plus multipart overhead; the API still
        # enforces its own limit, this only stops nginx pre-empting it.
        client_max_body_size 20m;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;

        # The API sets its own security headers; do not let a cached upstream
        # response override them.
        proxy_hide_header X-Powered-By;
    }

    # The sitemap has to come from the API: it lists every destination page, so
    # a file baked into this image goes stale the first time the catalogue
    # changes. Crawlers look for it at the root, hence the single proxied path.
    location = /sitemap.xml {
        proxy_pass $api_upstream/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_read_timeout 30s;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Client-side routing: unknown paths are React routes, not 404s.
    #
    # `$uri/index.html` is what serves the prerendered pages: /destinations/turkiye
    # finds the directory the build wrote and its index.html is returned directly.
    #
    # Deliberately not `$uri/`, which was tried and reverted. That form makes
    # nginx answer /destinations/turkiye with a 301 to /destinations/turkiye/ —
    # so every URL in the sitemap, every canonical and every hreflang href, all
    # of which are written without a trailing slash, would have redirected to a
    # different address than the one they named. Naming one URL as canonical
    # while bouncing crawlers to another is how an hreflang group gets thrown
    # out. Reaching the index.html directly returns 200 at the advertised URL.
    #
    # The fallback is deliberately not /index.html. That file is the prerendered
    # *home page* and carries the home page's canonical; serving it for, say, a
    # destination added after the last build would tell Google that page is a
    # duplicate of the home page and should be dropped. /fallback.html is the
    # same shell with an empty head, so React writes the correct tags itself.
    location / {
        try_files $uri $uri/index.html /fallback.html;
        add_header Cache-Control $html_cache_control always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Serve the .gz written at build time when the client accepts it, and only
    # fall back to compressing on the fly. Build-time compression runs at level 9
    # once, where a request-time pass has to stay cheap.
    gzip_static on;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

