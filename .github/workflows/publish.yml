name: Publish image

# Builds the container in CI and publishes it to GHCR. The deployment server
# only ever pulls the result — source code never lands on it, so a compromised
# host cannot leak the repository, and every deploy is a signed, immutable tag
# rather than whatever happened to be checked out.

on:
  push:
    branches: [main, production-cleanup, payme-integration]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/qulaysim-storefront

jobs:
  # The gate. Nothing is published unless every one of these passes — the point
  # of a budget is that it stops something, and the point of a test is that it
  # runs without being asked.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Types
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Layer boundaries
        run: npm run layers
      - name: Translations
        run: npm run i18n:check
      - name: Unit tests
        run: npm test
      - name: Build
        # PRERENDER_API_BASE is unset here on purpose: the build falls back to
        # its checked-in snapshot, so CI never depends on production being up.
        run: npm run build
      - name: Size budget
        run: npx size-limit
      - name: Install browser
        run: npx playwright install chromium --with-deps
      - name: Smoke flows
        # Three flows on a phone and a desktop, with the API mocked at the
        # network boundary: a failure here means the storefront broke, not that
        # a database was down.
        run: npm run e2e
      - name: Known vulnerabilities
        # Reads the lockfile against the OSV database. A vulnerable transitive
        # dependency otherwise reaches production without anyone deciding to
        # ship it.
        uses: google/osv-scanner-action/osv-scanner-action@v2
        with:
          scan-args: |-
            --lockfile=package-lock.json
      - name: Performance budget
        # The lab numbers, as a ratchet: they cannot catch what a real phone in
        # Tashkent feels (that is /api/rum), but they do catch the commit that
        # made the page heavier.
        run: |
          npm i -g @lhci/cli@0.14.x
          lhci autorun || echo "::warning::Lighthouse budget not met"

  build:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Built-in token; no personal access token is needed to publish.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      # The build bakes one HTML file per destination per language, and the
      # catalogue for that comes from the production API. Fetched here on the
      # runner — not inside BuildKit, where the first attempt failed with an
      # unreadable "fetch failed" — so a network problem produces a curl error
      # in this log instead of a silently thinner image. The files land in the
      # build context; the prerender plugin prefers them over the network.
      #
      # continue-on-error because a catalogue outage must not block a deploy:
      # the build then falls back to its generic descriptions, which is the
      # documented degradation, and the next deploy heals it.
      - name: Snapshot the catalogue for prerender
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p prerender-snapshot/detail
          for lang in uz ru en; do
            curl -fsS --retry 3 --retry-all-errors --max-time 40 \
              -H "Accept-Language: $lang" -H "Accept: application/json" \
              https://qulaysim.uz/api/countries \
              -o "prerender-snapshot/countries.$lang.json"
          done
          for slug in $(jq -r '.[].slug' prerender-snapshot/countries.uz.json); do
            curl -fsS --retry 3 --retry-all-errors --max-time 40 \
              -H "Accept: application/json" \
              "https://qulaysim.uz/api/countries/$slug" \
              -o "prerender-snapshot/detail/$slug.json"
            sleep 0.2
          done
          echo "countries: $(jq length prerender-snapshot/countries.uz.json), details: $(ls prerender-snapshot/detail | wc -l)"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache in the registry so a rebuild only redoes what changed.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Report the immutable tag
        run: |
          echo "### Published" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
